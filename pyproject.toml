[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dl-from-scratch"
version = "0.1.0"
description = "AIR-004 educational neural networks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]
[project.optional-dependencies]
research = ["numpy>=1.26,<3", "torch>=2.2,<3", "matplotlib>=3.8,<4", "pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
